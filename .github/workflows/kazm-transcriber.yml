name: KAZM Transcriber

# "What was played & what was said."
# Transcribes each 5h30m broadcast tape (recorded by the KAZM Tape Recorder
# workflow, stored as GitHub Release assets) with faster-whisper, aligns the
# transcript against the AzuraCast play history so programmed items (songs,
# spots, IDs) are tagged with their real metadata, and attaches the finished
# transcript JSON to a permanent monthly GitHub Release (transcripts-YYYY-MM).
# The tape pruner only deletes tape-* tags, so transcripts never rotate out:
# tapes live 14 days, transcripts are forever.
#
# Requires repo secret AZURACAST_API_KEY2 (an AzuraCast API key) for the
# play-history alignment step only. Without it the workflow fails cleanly
# before any transcription work is done.

on:
  workflow_run:
    workflows: ["KAZM Tape Recorder"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific tape release tag to transcribe (e.g. tape-kazm-2026-07-25-0600). Blank = newest without a transcript.'
        required: false
        default: ''
      count:
        description: 'How many missing blocks to transcribe this run (newest first). large-v3 runs ~20 min per block, well under the timeout, but stay modest on batch size during any future backlog.'
        required: false
        default: '1'
      force:
        description: 'Set true to re-transcribe the newest <count> blocks even if their transcripts already exist.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: kazm-transcriber
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AZ_HOST: https://streaming.mellowmountainradio.com
      AZ_STATION: mellowmountainradio
      AZ_KEY: ${{ secrets.AZURACAST_API_KEY2 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # apt-get install without a preceding update works only until the runner
      # image's pre-baked package index goes stale. On 2026-09-01 Ubuntu published
      # a new libssh-gcrypt-4 and dropped the old .deb from the mirror; the cached
      # index still pointed at it, so every run 404'd in this step. Refresh the
      # index first — and skip apt entirely when the image already carries ffmpeg,
      # which is the common case and takes a minute of mirror traffic off each run.
      - name: Install dependencies
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "[transcriber] ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          pip install --quiet faster-whisper requests

      - name: Pick blocks to transcribe
        id: pick
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request

          want_tag = "${{ github.event.inputs.tag }}".strip()
          count    = int("${{ github.event.inputs.count }}".strip() or "1")
          force    = "${{ github.event.inputs.force }}".strip().lower() == "true"

          # All tape releases still on the shelf (newest first)
          out = subprocess.run(
              ["gh", "release", "list", "--repo", "chelstein/mellowmountainradio",
               "--json", "tagName", "--limit", "100"],
              capture_output=True, text=True).stdout
          tapes = [r["tagName"] for r in json.loads(out or "[]")
                   if r["tagName"].startswith("tape-kazm-")]
          tapes.sort(reverse=True)

          # Transcripts already attached to the permanent transcripts-YYYY-MM releases
          done = set()
          out = subprocess.run(
              ["gh", "release", "list", "--repo", "chelstein/mellowmountainradio",
               "--json", "tagName", "--limit", "200"],
              capture_output=True, text=True).stdout
          months = [r["tagName"] for r in json.loads(out or "[]")
                    if r["tagName"].startswith("transcripts-")]
          for m in months:
              view = subprocess.run(
                  ["gh", "release", "view", m, "--repo", "chelstein/mellowmountainradio",
                   "--json", "assets"],
                  capture_output=True, text=True).stdout
              for a in json.loads(view or "{}").get("assets", []):
                  n = a.get("name", "")
                  if n.endswith(".json"):
                      done.add("tape-" + n[:-5])

          if want_tag:
              picks = [want_tag]
          elif force:
              # force targets the newest blocks — regeneration of recent output
              picks = tapes[:count]
          else:
              # missing blocks drain OLDEST-first: tapes prune at 14 days, and an
              # untranscribed tape that prunes is speech lost forever
              picks = sorted(t for t in tapes if t not in done)[:count]

          print(f"[transcriber] {len(tapes)} tapes on shelf, {len(done)} transcribed, picking: {picks}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("picks=" + json.dumps(picks) + "\n")
          PYEOF

      # The model is ~3GB and was being re-pulled from Hugging Face on every run.
      # Actions runners share outbound IPs, so anonymous HF pulls eventually draw
      # a 429 and the job dies before decoding a second of audio. Cached, the
      # model is fetched from HF exactly once per cache lifetime; after that HF
      # is only consulted to confirm the revision, and a failed confirmation
      # falls through to the local copy rather than aborting.
      - name: Restore the Whisper model
        if: steps.pick.outputs.picks != '[]'
        uses: actions/cache@v4
        with:
          # faster-whisper defaults to the huggingface_hub cache; no env needed.
          path: ~/.cache/huggingface/hub
          key: faster-whisper-large-v3-v1

      - name: Fetch the Whisper model
        if: steps.pick.outputs.picks != '[]'
        run: |
          python3 - <<'PYEOF'
          import os, sys, time
          from huggingface_hub import snapshot_download

          REPO   = "Systran/faster-whisper-large-v3"
          DELAYS = [15, 30, 60, 120, 240]   # ~7.5 min of patience, then fail loudly

          def have_it(path):
              # Every later HF call in this job can now be answered from disk, so
              # take the network out of the transcription step entirely rather
              # than relying on the hub's fall-back-to-local behaviour.
              print("[transcriber] model ready at", path)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("HF_HUB_OFFLINE=1\n")

          try:
              have_it(snapshot_download(REPO, local_files_only=True))   # cache hit: no network
              sys.exit(0)
          except SystemExit:
              raise
          except Exception:
              print("[transcriber] model not in cache — fetching from Hugging Face")

          for attempt in range(len(DELAYS) + 1):
              try:
                  have_it(snapshot_download(REPO))
                  break
              except Exception as e:
                  if attempt == len(DELAYS):
                      sys.exit(f"[transcriber] could not fetch {REPO} after {attempt + 1} attempts: {e}")
                  d = DELAYS[attempt]
                  print(f"[transcriber] fetch failed ({e.__class__.__name__}), retrying in {d}s", flush=True)
                  time.sleep(d)
          PYEOF

      - name: Transcribe and align
        if: steps.pick.outputs.picks != '[]'
        run: |
          cat > /tmp/kazm_transcribe.py <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.request, urllib.parse
          from datetime import datetime, timezone

          AZ_HOST    = os.environ["AZ_HOST"]
          AZ_STATION = os.environ["AZ_STATION"]
          AZ_KEY     = os.environ.get("AZ_KEY", "")

          def az(path, payload=None):
              req = urllib.request.Request(
                  AZ_HOST + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"X-API-Key": AZ_KEY, "Content-Type": "application/json"},
                  method="POST" if payload is not None else "GET")
              return json.load(urllib.request.urlopen(req, timeout=120))

          def block_identity(tag):
              # tape-kazm-YYYY-MM-DD-HH00
              m = re.match(r"tape-(kazm-(\d{4})-(\d{2})-(\d{2})-(\d{2})00)$", tag)
              if not m: sys.exit(f"[transcriber] bad tag: {tag}")
              name = m.group(1)
              date = f"{m.group(2)}-{m.group(3)}-{m.group(4)}"
              start_h = int(m.group(5))
              return name, date, start_h

          def rec_start_secs(date, start_h):
              # Actual recording start (seconds from AZ midnight) from the rewind
              # manifest when the block is still inside the 14-day window;
              # otherwise assume the scheduled :01 start.
              try:
                  with open("rewind-manifest.json") as f:
                      for b in json.load(f).get("blocks", []):
                          if b.get("date") == date and b.get("start") == start_h and b.get("recStart"):
                              return int(b["recStart"])
              except Exception:
                  pass
              return start_h * 3600 + 60

          def is_music(ti, ar):
              # Port of serverIsMusicPlay from mcp-server/server.js — the station's
              # own filter separating music spins from carts, spots, IDs, and talk.
              if not ti or not ar: return False
              if re.search(r"^ADBREAK_|^GO2-|^Sweeper_|^CLEARWATER|^Station ID|^Mellow Mountain Radio|^ID/PSA|^AZ Sports|^Sports Update|^AZ State News|^Coast to Coast AM", ti, re.I): return False
              if re.match(r"^[A-Z0-9][A-Z0-9_\-]{4,}$", ti): return False
              if re.search(r"\bFINAL\b|\(SPEC\b|\bREV\s*\d+\b|\bAIRCHECK\b", ti, re.I): return False
              if re.search(r"^Live365$|^Mellow Mountain Radio$|^Station ID$|^Talk Break$|^Diamondbacks Bumper$|^c2c$|^CBS$|^Brad Cesmat$|George Noo[rg]ey|Brought to you|APS.*(Fire|Mitigation)|Versatile Roofing|Sedona Chamber|Franklin Pest|Yavapai Bottle|Toastmasters|Sedona Fire|CBS News|Cutter Grind", ar, re.I): return False
              if re.search(r"\b(HDM|LLC|Inc\.?|Corp\.?)\b|\bOil\s+(and|&)\s+Lube\b|\bCity\s+of\s+\w|\bAccounting\s+Service|Frontburner\s+Media|~\s*Attention\b", ar, re.I): return False
              return True

          def item_kind(ti, ar):
              # music: a real spin. show: syndicated programming (affiliate — we may
              # transcribe it). station: KAZM's own voice — weather, news, IDs, talk
              # breaks, promos. spot: commercials and PSAs — excluded from the
              # archive entirely per station policy.
              if is_music(ti, ar): return "music"
              both = f"{ti} :: {ar}"
              if re.search(r"^ADBREAK_|^GO2-|\bFINAL\b|\(SPEC\b|\bREV\s*\d+\b", ti, re.I):
                  return "spot"
              if re.search(r"Coast to Coast|^c2c$|^CBS$|CBS News|George Noo[rg]ey|Brad Cesmat|AZ Sports|Sports Update|AZ State News", both, re.I):
                  return "show"
              if re.search(r"Mellow Mountain|KAZM|Sounder|Sweeper|Weather|Newscast|Top of Hour|Legal ID|^Talk Break ::", both, re.I) \
                 or re.match(r"^(Station ID|Live365|Mellow Mountain Radio|Talk Break)$", ar, re.I):
                  return "station"
              return "spot"

          def fetch_history(date, t0, t1):
              # AZ (UTC-7, no DST) window -> UTC ISO
              base = datetime.strptime(date, "%Y-%m-%d").replace(tzinfo=timezone.utc).timestamp() + 7 * 3600
              q = urllib.parse.urlencode({
                  "start": datetime.fromtimestamp(base + t0, tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "end":   datetime.fromtimestamp(base + t1, tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "rows": 2000})
              rows = az(f"/api/station/{AZ_STATION}/history?{q}")
              items = []
              for p in rows if isinstance(rows, list) else []:
                  song = p.get("song") or {}
                  t = int(p.get("played_at") or 0) - int(base)
                  ti = song.get("title") or ""
                  ar = song.get("artist") or ""
                  kind = item_kind(ti, ar)
                  items.append({
                      "t": t,
                      "dur": int(p.get("duration") or 0),
                      "title": ti,
                      "artist": ar,
                      "kind": kind,
                      "music": kind == "music"})
              items.sort(key=lambda i: i["t"])
              return items

          MODEL = "large-v3"

          def transcribe(wav):
              from faster_whisper import WhisperModel
              model = WhisperModel(MODEL, device="cpu", compute_type="int8")
              segments, info = model.transcribe(wav, beam_size=1, vad_filter=True,
                                                vad_parameters={"min_silence_duration_ms": 700})
              out = []
              for s in segments:
                  text = s.text.strip()
                  if text:
                      out.append({"s": round(s.start, 1), "e": round(s.end, 1), "text": text})
              print(f"[transcriber] {len(out)} segments, audio {info.duration:.0f}s")
              return out

          def upload(name, date, doc):
              # Permanent monthly release; the tape pruner only touches tape-* tags.
              tag = "transcripts-" + date[:7]
              path = f"/tmp/{name}.json"
              with open(path, "w") as f:
                  json.dump(doc, f, separators=(",", ":"))
              exists = subprocess.run(["gh", "release", "view", tag,
                                       "--repo", "chelstein/mellowmountainradio"],
                                      capture_output=True).returncode == 0
              if not exists:
                  subprocess.run(["gh", "release", "create", tag,
                                  "--repo", "chelstein/mellowmountainradio",
                                  "--title", f"KAZM transcripts: {date[:7]}",
                                  "--notes", "Broadcast transcripts — what was played and what was said. Permanent.",
                                  "--prerelease"], check=True)
              subprocess.run(["gh", "release", "upload", tag, path, "--clobber",
                              "--repo", "chelstein/mellowmountainradio"], check=True)
              os.remove(path)
              print(f"[transcriber] uploaded {name}.json to release {tag}")

          if not AZ_KEY:
              sys.exit("[transcriber] AZURACAST_API_KEY2 secret is not set — needed for play-history alignment. Aborting before transcription.")

          tag = sys.argv[1]
          name, date, start_h = block_identity(tag)
          rec0 = rec_start_secs(date, start_h)
          mp3 = f"/tmp/{name}.mp3"
          wav = f"/tmp/{name}.wav"

          print(f"[transcriber] downloading {tag}")
          subprocess.run(["gh", "release", "download", tag,
                          "--repo", "chelstein/mellowmountainradio",
                          "--pattern", "*.mp3", "--output", mp3, "--clobber"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error",
                          "-i", mp3, "-ar", "16000", "-ac", "1", "-y", wav], check=True)
          os.remove(mp3)

          segs = transcribe(wav)
          os.remove(wav)

          audio_end = max((s["e"] for s in segs), default=19800)
          items = fetch_history(date, rec0, rec0 + int(audio_end) + 60)

          # MegaSeg logs wall-to-wall, so nearly every second overlaps a history item.
          # Classify each segment by the kind of item it overlaps: station carts and
          # syndicated shows keep their text ("talk"/"show"), music spins keep text
          # tagged "music" (whisper mishearing lyrics — filterable), live mic moments
          # ("live") keep text, and commercials/PSAs are dropped entirely.
          iv = {k: [(i["t"], i["t"] + i["dur"]) for i in items if i["dur"] > 0 and i["kind"] == k]
                for k in ("music", "station", "show", "spot")}
          kept = []
          dropped = 0
          for s in segs:
              a, b = rec0 + s["s"], rec0 + s["e"]
              s["s"], s["e"] = round(a), round(b)   # seconds from AZ midnight
              if   any(a < y and b > x for x, y in iv["station"]): s["type"] = "talk"
              elif any(a < y and b > x for x, y in iv["show"]):    s["type"] = "show"
              elif any(a < y and b > x for x, y in iv["music"]):   s["type"] = "music"
              elif any(a < y and b > x for x, y in iv["spot"]):    dropped += 1; continue
              else: s["type"] = "live"
              kept.append(s)
          segs = kept

          counts = {t: sum(1 for s in segs if s["type"] == t) for t in ("talk", "show", "live", "music")}
          print(f"[transcriber] {counts} kept, {dropped} spot/PSA segments dropped, {len(items)} history items")

          upload(name, date, {
              "block": name, "date": date, "start": start_h, "recStart": rec0,
              "model": MODEL, "generated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "programmed": items,
              "segments": segs})
          PYEOF

          for TAG in $(echo '${{ steps.pick.outputs.picks }}' | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin)))"); do
            echo "::group::$TAG"
            python3 /tmp/kazm_transcribe.py "$TAG"
            echo "::endgroup::"
          done
