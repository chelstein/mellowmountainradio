name: KAZM Tape Recorder

# Records the live stream in 5h30m blocks, stores each as a GitHub Release asset,
# and keeps rewind-manifest.json current so the Listeners Lounge tape player works.
# Blocks (releases) are deleted after 14 days. GitHub Releases sidesteps the
# AzuraCast nginx client_max_body_size limit that was killing every upload.

on:
  schedule:
    # 1:01, 7:01, 13:01, 19:01 UTC = 18:01, 0:01, 6:01, 12:01 Arizona (UTC-7)
    #
    # Stays at minute 1, on purpose. Every minute later is airtime lost off the
    # front of the block when GitHub does start us on time. Do not move this
    # later to dodge scheduler congestion: minute 23 was tried on sedona-data
    # for exactly that reason and changed nothing.
    - cron: "1 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: 'Recording duration in seconds (default: 19800 = 5h30m full block)'
        required: false
        default: '19800'

permissions:
  contents: write

concurrency:
  group: kazm-tape
  cancel-in-progress: false

jobs:
  record:
    runs-on: [self-hosted, Linux, X64, mmr-ci]
    # A full tape (19800s = 330 min) plus the prune, upload and manifest push.
    # No run waits any more, so the 450 that covered a 90-minute wait is gone.
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v5

      - name: Compute block identity (Arizona time, UTC-7 fixed offset)
        id: block
        run: |
          AZ_EPOCH=$(( $(date -u +%s) - 7*3600 ))
          YEAR=$(date -u -d "@$AZ_EPOCH" +%Y)
          MONTH=$(date -u -d "@$AZ_EPOCH" +%m)
          DAY=$(date -u -d "@$AZ_EPOCH" +%d)
          HOUR=$(date -u -d "@$AZ_EPOCH" +%H)
          BLOCK_HOUR=$(( (10#$HOUR / 6) * 6 ))
          BLOCK_PAD=$(printf "%02d" $BLOCK_HOUR)
          FILENAME="kazm-${YEAR}-${MONTH}-${DAY}-${BLOCK_PAD}00"
          DATE_STR="${YEAR}-${MONTH}-${DAY}"

          # BLOCK_HOUR is an INDEX, not a claim about what the audio covers.
          #
          # #199 bounded each recording to the end of its nominal block so a late
          # start could not run past the boundary and cost the next slot. That
          # reasoning assumed the next slot would arrive. Measured over 2026-11-20
          # to 11-26, it usually does not: GitHub delivers only the 07:01 and
          # 19:01 slots, drops 01:01 and 13:01 outright every single day, and runs
          # the two survivors about three hours late. So the cap was not protecting
          # a following run; it was shortening every tape for nothing.
          #
          #   2026-11-20..22   11.00 h/day   0 truncated   (before the cap)
          #   2026-11-23        5.85 h/day   1 truncated   (#199 merged)
          #   2026-11-24        4.28 h/day   2 truncated
          #   2026-11-25        6.22 h/day   2 truncated
          #
          # Two delivered triggers x 5h30m is the 11.00 h/day this used to get.
          # Two delivered triggers x "whatever was left of the block" is 4-6.
          # The cap cost about five hours of archive a day, so it is gone: we
          # record a full tape from wherever the trigger lands.
          #
          # If a slot does fire mid-recording it queues behind us (the kazm-tape
          # group is cancel-in-progress: false) and starts when we finish, so the
          # chain re-paces itself to real start times instead of being dropped.
          #
          # The honest coverage of the audio is recStart + durationSec in the
          # manifest, which the player already uses as its time base. BLOCK_HOUR
          # only keys the entry and labels the button.
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE_STR"     >> "$GITHUB_OUTPUT"
          echo "start=$BLOCK_HOUR"  >> "$GITHUB_OUTPUT"
          echo "[tape] block: $FILENAME (AZ $DATE_STR $BLOCK_HOUR:00)"

      - name: What this block already has on tape
        id: existing
        # This guard exists to protect the archive, so it must never itself be
        # the reason a recording does not happen. If anything in it goes wrong
        # we fall through to secs=0 and record: replacing a tape is a risk,
        # failing to make one is a certain loss. Run 490 proved the point by
        # dying here and taking a whole block with it.
        continue-on-error: true
        run: |
          # The upload step deletes the release for this block's tag before
          # recreating it, and the manifest replaces the entry for
          # (date, start). So a second run inside the same block would replace a
          # good tape with a shorter one. Nothing in the schedule should cause
          # that, but a manual dispatch can, and the archive is the one thing
          # here that cannot be re-made.
          #
          # Read from origin/main, not the checkout: the checkout is pinned to
          # the SHA that triggered this run, which can predate the previous
          # run's manifest push.
          #
          # Write under RUNNER_TEMP, never a fixed path in /tmp. A fixed name is
          # not reliably writable across these runners: run 490 died with
          # "/tmp/manifest-check.json: Permission denied" on mmr-ci-02 while the
          # identical path had worked on mmr-ci-04 the run before. RUNNER_TEMP is
          # per-job and guaranteed writable, so it cannot collide with another
          # runner, another user, or a leftover file.
          WORK="${RUNNER_TEMP:-.}/manifest-check.json"
          git fetch -q origin main 2>/dev/null || true
          git show origin/main:rewind-manifest.json > "$WORK" 2>/dev/null || echo '{}' > "$WORK" 2>/dev/null || true
          SECS=$(python3 - "${{ steps.block.outputs.date }}" "${{ steps.block.outputs.start }}" "$WORK" <<'PYEOF'
          import json, sys

          date_str, start_h, path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          try:
              with open(path) as f:
                  blocks = json.load(f).get("blocks", [])
          except Exception:
              # No manifest, unreadable, or malformed: report nothing on tape so
              # the run records. Never let this read decide against recording.
              blocks = []
          same = [b.get("durationSec", 0) for b in blocks
                  if b.get("date") == date_str and b.get("start") == start_h]
          print(max(same) if same else 0)
          PYEOF
          ) || SECS=0
          case "$SECS" in ''|*[!0-9]*) SECS=0 ;; esac
          echo "secs=$SECS" >> "$GITHUB_OUTPUT"
          echo "[tape] block already on tape: ${SECS}s"

      - name: Ensure ffmpeg
        # The runner image ships ffmpeg. Installing it unconditionally added a
        # network dependency — and an apt-get without a preceding update is a
        # coin flip on stale package lists. Only reach for apt if it is actually
        # missing.
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "[tape] ffmpeg present: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Prune GitHub releases older than 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, json
          from datetime import datetime, timezone, timedelta

          cutoff = (datetime.now(timezone.utc) - timedelta(days=14)).strftime("%Y-%m-%dT%H:%M:%SZ")
          result = subprocess.run(
              ['gh', 'release', 'list', '--repo', 'chelstein/mellowmountainradio',
               '--json', 'tagName,publishedAt', '--limit', '100'],
              capture_output=True, text=True
          )
          releases = json.loads(result.stdout or '[]')
          deleted = 0
          for r in releases:
              if r.get('tagName', '').startswith('tape-') and r['publishedAt'] < cutoff:
                  subprocess.run(['gh', 'release', 'delete', r['tagName'],
                                  '--repo', 'chelstein/mellowmountainradio',
                                  '--yes', '--cleanup-tag'], capture_output=True)
                  print(f"[tape] pruned {r['tagName']}")
                  deleted += 1
          print(f"[tape] pruned {deleted} old release(s)")
          PYEOF

      - name: Record stream
        id: recording
        run: |
          FILENAME="${{ steps.block.outputs.filename }}"
          FULL_BLOCK=19800

          WANTED="${{ github.event.inputs.duration }}"
          if [ -z "$WANTED" ]; then WANTED=$FULL_BLOCK; fi

          # A full tape, however late we started. See the block-identity step for
          # why the old block cap is gone: it was trading roughly five hours of
          # archive a day to protect a following run that mostly never arrives.
          DURATION="$WANTED"

          # Never trade a longer tape for a shorter one. See the note in the
          # block-identity step: re-recording a block replaces its release and
          # its manifest entry.
          # Empty when the guard step errored out (it is continue-on-error, so a
          # failure there leaves no output). Unknown means record, not stand down.
          EXISTING="${{ steps.existing.outputs.secs }}"
          case "$EXISTING" in ''|*[!0-9]*) EXISTING=0 ;; esac
          if [ "$EXISTING" -ge "$DURATION" ] && [ "$EXISTING" -gt 0 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Block ${FILENAME} already holds ${EXISTING}s on tape, which is at least the ${DURATION}s available now — standing down rather than replacing it with a shorter one."
            exit 0
          fi

          # Only reachable from a workflow_dispatch asking for a sliver. Nothing
          # under two minutes is worth a release and a manifest entry.
          if [ "$DURATION" -lt 120 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Requested duration ${DURATION}s is too short to be worth publishing — standing down. Block ${FILENAME} is not on tape."
            exit 0
          fi

          REC_START_SECS=$(( ($(date -u +%s) - 7*3600) % 86400 ))
          echo "rec_start=$REC_START_SECS" >> "$GITHUB_OUTPUT"
          echo "[tape] recording /tmp/${FILENAME}.mp3 for ${DURATION}s (AZ offset: ${REC_START_SECS}s from midnight)"

          # -reconnect survives a transient drop on the stream. Without it a
          # single hiccup ends the capture early and ffmpeg still exits 0, which
          # is how a fragment becomes indistinguishable from a full block.
          ffmpeg -hide_banner -loglevel error \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 30 \
            -i "https://streaming.mellowmountainradio.com/listen/mellowmountainradio/radio.mp3" \
            -t "$DURATION" -c copy -y "/tmp/${FILENAME}.mp3" || true

          if [ ! -s "/tmp/${FILENAME}.mp3" ]; then
            echo "[tape] recording came out empty" >&2
            exit 1
          fi

          BYTES=$(stat -c%s "/tmp/${FILENAME}.mp3")
          ACTUAL=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \
                     "/tmp/${FILENAME}.mp3" 2>/dev/null | cut -d. -f1)
          case "$ACTUAL" in ''|*[!0-9]*) ACTUAL=0 ;; esac
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"

          # A short tape is kept, not discarded — a partial recording is still
          # the only record of that airtime. But it is LABELLED, because the
          # failure this guards against is a fragment being indexed as a
          # complete block and later read as evidence that nothing aired in the
          # missing hours. Absence of audio is not absence of broadcast.
          # Two different questions, and they used to share one answer.
          #
          # (a) Did the capture deliver what we asked for? Short of that means the
          #     stream or the runner misbehaved — worth a warning either way.
          if [ "$ACTUAL" -lt $(( DURATION * 90 / 100 )) ]; then
            echo "::warning::Tape ${FILENAME} under-delivered: ${ACTUAL}s of the ${DURATION}s requested. The stream or the runner dropped out."
          fi

          # (b) Is this tape a full block's worth of audio? That is what the
          #     manifest flag means, and it is measured against the full block
          #     length so it stays comparable across tapes. Now that nothing
          #     shortens DURATION on purpose, a tape short of this means the
          #     stream or the runner dropped out — the flag marks a gap in the
          #     RECORDING, which is never evidence of a gap in the broadcast.
          if [ "$ACTUAL" -ge $(( FULL_BLOCK * 90 / 100 )) ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "[tape] done — ${ACTUAL}s / ${FULL_BLOCK}s block, ${BYTES} bytes"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tape ${FILENAME} is a partial block: ${ACTUAL}s of ${FULL_BLOCK}s. Keeping it, marking it truncated in the manifest."
            echo "[tape] PARTIAL — ${ACTUAL}s / ${FULL_BLOCK}s block, ${BYTES} bytes"
          fi

          # Below a minute there is nothing worth publishing and something is
          # genuinely wrong with the stream or the runner. Fail loudly.
          if [ "$ACTUAL" -lt 60 ]; then
            echo "[tape] recording unusably short (${ACTUAL}s) — failing" >&2
            exit 1
          fi

      - name: Upload to GitHub Release
        id: upload
        if: steps.recording.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILENAME="${{ steps.block.outputs.filename }}"
          TAG="tape-${FILENAME}"

          # Delete any existing release for this block slot before re-creating
          gh release delete "$TAG" --repo chelstein/mellowmountainradio \
            --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            --repo chelstein/mellowmountainradio \
            --title "KAZM tape: $FILENAME" \
            --notes "Automated broadcast recording. Auto-deleted after 14 days." \
            --prerelease \
            "/tmp/${FILENAME}.mp3#${FILENAME}.mp3"

          DOWNLOAD_URL="https://github.com/chelstein/mellowmountainradio/releases/download/${TAG}/${FILENAME}.mp3"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "[tape] uploaded: $DOWNLOAD_URL"
          rm -f "/tmp/${FILENAME}.mp3"

      - name: Commit and push manifest
        if: steps.recording.outputs.skipped != 'true'
        run: |
          git config user.name "mmr-tape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="${{ steps.upload.outputs.download_url }}"
          DATE_STR="${{ steps.block.outputs.date }}"
          START_H="${{ steps.block.outputs.start }}"
          REC_START="${{ steps.recording.outputs.rec_start }}"
          FILENAME="${{ steps.block.outputs.filename }}"
          ACTUAL="${{ steps.recording.outputs.actual }}"
          COMPLETE="${{ steps.recording.outputs.complete }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # -f is load-bearing. Every failure this workflow has had (runs 34,
            # 36 and 38, 15-16 July) was a plain `git checkout origin/main`
            # aborting with "local changes would be overwritten" after the
            # manifest had been touched. The tape was already recorded and
            # uploaded by then, so the run failed having done all the expensive
            # work and lost only the index entry. Nothing here needs the working
            # tree preserved: the manifest is rebuilt from origin/main every
            # iteration.
            git checkout -f origin/main
            python3 - "$URL" "$DATE_STR" "$START_H" "$REC_START" "$ACTUAL" "$COMPLETE" <<'PYEOF'
          import sys, json
          from datetime import datetime, timezone, timedelta

          url       = sys.argv[1]
          date_str  = sys.argv[2]
          start_h   = int(sys.argv[3])
          rec_start = int(sys.argv[4]) if len(sys.argv) > 4 and sys.argv[4] else start_h * 3600
          actual    = int(sys.argv[5]) if len(sys.argv) > 5 and sys.argv[5].isdigit() else 0
          complete  = (len(sys.argv) > 6 and sys.argv[6] == "true")

          # start is the 6-hour grid slot this tape is FILED under. recStart is
          # the Arizona second-of-day the audio actually begins, and with
          # durationSec it is the only honest statement of what the tape covers:
          # a trigger three hours late files under start=0 and covers 03:00-08:30.
          # The player already treats recStart as its time base and falls back to
          # start * 3600 only when it is absent, so do not read start as coverage.
          new_block = {"url": url, "date": date_str, "start": start_h, "recStart": rec_start}
          # Extra keys only; the player reads url/date/start/recStart and ignores
          # the rest. A truncated block says so in the index itself, so anyone
          # mining these tapes later can tell a gap in the recording from a gap
          # in the broadcast.
          if actual:
              new_block["durationSec"] = actual
          if not complete:
              new_block["truncated"] = True

          with open("rewind-manifest.json") as f:
              manifest = json.load(f)

          cutoff_str = (datetime.now(timezone.utc) - timedelta(days=14)).strftime("%Y-%m-%d")
          kept = [b for b in manifest.get("blocks", []) if b.get("date", "") >= cutoff_str]
          kept = [b for b in kept if not (b["date"] == date_str and b["start"] == start_h)]
          kept.append(new_block)
          kept.sort(key=lambda b: (b["date"], b["start"]))

          manifest["ok"]     = True
          manifest["blocks"] = kept

          with open("rewind-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          print(f"[tape] manifest updated: {len(kept)} block(s)")
          PYEOF
            git add rewind-manifest.json
            if git diff --staged --quiet; then
              echo "[tape] no manifest changes"
              exit 0
            fi
            git commit -m "KAZM tape: $FILENAME [skip ci]"
            git push origin HEAD:main && exit 0
            echo "[tape] push failed (attempt $attempt/5), retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "[tape] all push attempts failed" >&2
          exit 1
