# OpenEAS MCP server — nginx reverse proxy.
#
# Place at /etc/nginx/sites-available/openeas and symlink into sites-enabled.
# Replace SERVER_NAME_HERE with your hostname, then run:
#
#     certbot --nginx -d your.hostname
#
# ── Why this file is HTTP-only ───────────────────────────────────────────────
#
# It deliberately contains NO `listen 443 ssl` block. nginx refuses to start if
# `listen ... ssl` appears without an ssl_certificate:
#
#     [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
#
# and certbot cannot issue a certificate until nginx is valid and answering the
# ACME challenge on port 80. Shipping a 443 block with commented-out certificate
# paths is therefore unbootstrappable — it can never pass `nginx -t`.
#
# `certbot --nginx` adds the TLS server block itself: it clones this block, adds
# the certificate directives, and (with --redirect) rewrites port 80 to redirect.
# That is the supported flow, so let it do its job.
#
# The upstream binds loopback only; nginx is the sole public entry point.

upstream openeas_backend {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Bound per-IP so a single client cannot exhaust FEMA or NWS quota through us.
# Both upstreams are public goodwill services — FEMA's guidance is explicit that
# providers "cannot stress IPAWS servers with excessive requests."
limit_req_zone $binary_remote_addr zone=openeas_rl:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    # Kept reachable over plain HTTP so certbot can renew unattended.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    access_log /var/log/nginx/openeas.access.log;
    error_log  /var/log/nginx/openeas.error.log;

    client_max_body_size 1m;

    # certbot copies these into the TLS block it generates. HSTS is ignored by
    # browsers over plain HTTP, so it is harmless here and correct once TLS is up.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # MCP endpoint. Streamable HTTP transport, so buffering must be off and the
    # read timeout generous enough for an IPAWS fan-out (index plus one GET per
    # candidate alert).
    location /mcp {
        limit_req zone=openeas_rl burst=20 nodelay;

        proxy_pass http://openeas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Public read-only surface. CORS is open because there is nothing to
        # protect: every byte served here derives from public federal feeds.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Mcp-Session-Id" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /health {
        proxy_pass http://openeas_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = / {
        default_type text/plain;
        return 200 "OpenEAS - read-only observability for the U.S. Emergency Alert System.\n\nMCP endpoint: /mcp\nHealth: /health\nSpec: https://github.com/chelstein/mellowmountainradio/blob/main/openeas/SPEC.md\n\nAdvisory data only. NOT authoritative and NOT for life-safety decisions.\nFor official alerts consult the originating authority.\n\nThis service cannot originate, encode, relay, delay, or transmit an alert\nand has no connection to any broadcast air chain.\n";
    }

    location / { return 404; }
}

# ── TLS hardening, applied after certbot runs ────────────────────────────────
# certbot writes sane defaults to /etc/letsencrypt/options-ssl-nginx.conf and
# includes it in the block it generates, so there is nothing to add here.
# To pin further, edit the generated block directly.
#
# HTTP/2 is not enabled. `http2 on;` requires nginx >= 1.25.1; Ubuntu 24.04 LTS
# ships 1.24.0, where that directive does not exist. The 1.24 form is
# `listen 443 ssl http2;`, deprecated on 1.25+. HTTP/1.1 with keepalive is
# adequate for JSON-RPC request/response and MCP streamable HTTP does not need
# HTTP/2. To enable, add the form appropriate to your nginx version to the
# certbot-generated 443 block.
