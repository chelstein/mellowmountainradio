# OpenEAS MCP server — nginx reverse proxy.
#
# Place at /etc/nginx/sites-available/openeas and symlink into sites-enabled.
# Replace SERVER_NAME_HERE with your hostname, then run certbot for TLS.
#
# The upstream is bound to loopback only; nginx is the sole public entry point.

upstream openeas_backend {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Bound per-IP so a single client cannot exhaust FEMA or NWS quota through us.
# Both upstreams are public goodwill services — FEMA's guidance is explicit that
# providers "cannot stress IPAWS servers with excessive requests."
limit_req_zone $binary_remote_addr zone=openeas_rl:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    # certbot rewrites this block to redirect to 443 once TLS is issued.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name SERVER_NAME_HERE;

    # HTTP/2 is deliberately not enabled here.
    #
    # The `http2 on;` directive requires nginx >= 1.25.1. Ubuntu 24.04 LTS ships
    # nginx 1.24.0, where it is an unknown directive and nginx refuses to start:
    #     [emerg] unknown directive "http2"
    # The 1.24 form is `listen 443 ssl http2;`, which is in turn deprecated and
    # warns on 1.25+. Rather than pick a form that breaks on one version or the
    # other, this config omits it — HTTP/1.1 with keepalive is entirely adequate
    # for JSON-RPC request/response, and MCP streamable HTTP does not need it.
    #
    # To enable on nginx >= 1.25.1, add `http2 on;` to this block.
    # To enable on nginx 1.24, append `http2` to the listen directives above.

    # certbot manages these lines.
    # ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:openeas_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/openeas.access.log;
    error_log  /var/log/nginx/openeas.error.log;

    client_max_body_size 1m;

    # MCP endpoint. Streamable HTTP transport, so buffering must be off and the
    # read timeout generous enough for an IPAWS fan-out (index plus one GET per
    # candidate alert).
    location /mcp {
        limit_req zone=openeas_rl burst=20 nodelay;

        proxy_pass http://openeas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Public read-only surface. CORS is open because there is nothing to
        # protect: every byte served here derives from public federal feeds.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Mcp-Session-Id" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /health {
        proxy_pass http://openeas_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = / {
        default_type text/plain;
        return 200 "OpenEAS - read-only observability for the U.S. Emergency Alert System.\n\nMCP endpoint: /mcp\nHealth: /health\nSpec: https://github.com/chelstein/mellowmountainradio/blob/main/openeas/SPEC.md\n\nAdvisory data only. NOT authoritative and NOT for life-safety decisions.\nFor official alerts consult the originating authority.\n\nThis service cannot originate, encode, relay, delay, or transmit an alert\nand has no connection to any broadcast air chain.\n";
    }

    location / { return 404; }
}
